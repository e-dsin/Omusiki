services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: omusika
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U user -d omusika"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  meilisearch:
    image: getmeili/meilisearch:v1.11
    ports:
      - "7700:7700"
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: dev-master-key

  api:
    image: omusiki
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: apps/api/.env
        required: false
    environment: &docker-net
      DATABASE_URL: postgresql://user:password@db:5432/omusika
      REDIS_URL: redis://redis:6379
      MEILI_HOST: http://meilisearch:7700
      FUNCTIONS_URL: http://functions:3002
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    links:
      - db
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  web:
    image: omusiki
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: apps/web/.env
        required: false
    environment:
      VITE_API_URL: http://localhost:3001
    ports:
      - "5173:5173"
    command: ["npm", "run", "dev", "-w", "@omusiki/web", "--", "--host", "0.0.0.0"]
    depends_on:
      api:
        condition: service_healthy

  cms:
    image: omusiki
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: apps/cms/.env
        required: false
    environment:
      VITE_API_URL: http://localhost:3001
    ports:
      - "5174:5174"
    command: ["npm", "run", "dev", "-w", "@omusiki/cms", "--", "--host", "0.0.0.0"]
    depends_on:
      api:
        condition: service_healthy

  functions:
    image: omusiki
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: apps/functions/.env
        required: false
    environment:
      <<: *docker-net
    ports:
      - "3002:3002"
    command: ["sh", "docker/with-db.sh", "npm", "run", "start", "-w", "@omusiki/functions"]
    depends_on:
      api:
        condition: service_healthy
    links:
      - db

volumes:
  postgres_data:
